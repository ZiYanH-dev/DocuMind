[alembic]
script_location = alembic
prepend_sys_path = .
# 注意：连接串不在此配置。数据库 URL 由 alembic/env.py 从 settings 注入
# （settings 读取根目录 .env），避免连接串在 .env 与 alembic.ini 两处维护。

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S