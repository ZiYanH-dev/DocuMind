[project]
name = "documind-backend"
version = "0.1.0"
description = "DocuMind - 基于个人知识库的 RAG 智能问答系统"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.1",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.2.5",
    "pydantic>=2.7.0",
    "email-validator>=2.1.0",
    "pydantic-settings>=2.3.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.1,<4.1",
    "python-multipart>=0.0.9",
    "redis>=5.0.4",
    "langchain-core>=0.2.0",
    "langchain>=1.0.0",
    "langchain-openai>=0.1.0",
    "langchain-text-splitters>=0.2.0",
    "pypdf>=4.2.0",
    "python-docx>=1.1.0",
    "sse-starlette>=2.0.0",
    "langgraph>=1.2.11",
    "pyyaml>=6.0.3",
    "jieba>=0.42.1",
    "rank-bm25>=0.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "unit: 纯逻辑测试，不依赖数据库与网络，任何时候都能跑",
    "service: 服务层测试，用内存 Repository 替身，不需要数据库",
    "http: HTTP 层测试，TestClient + 内存替身，不需要数据库",
    "integration: 经 HTTP 走完整链路，需要 PostgreSQL",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "pytest-cov>=7.1.0",
]
