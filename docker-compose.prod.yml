# ===== 生产部署 compose =====
# 用法（项目根目录）：
#   docker compose -f docker-compose.prod.yml up -d --build
# 依赖根目录 .env 提供密钥与接入配置（POSTGRES_*/SECRET_KEY/LLM_* 等）。
#
# 与开发 docker-compose.yml 的区别：
#   1. 用 Dockerfile 构建后端与前端镜像（而非挂代码卷）
#   2. nginx 统一对外 —— 生产只暴露 80，后端不对外
#   3. 迁移在后端容器 CMD 中"启动前自动执行"（alembic upgrade head）
#   4. 生产仅 PostgreSQL / Redis / 后端 / 前端(nginx) 四服务

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-documind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-documind_123}
      POSTGRES_DB: ${POSTGRES_DB:-documind}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    # 复用本地已有镜像 redis:6-alpine（与开发 docker-compose.yml 一致）
    image: redis:6-alpine
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    # 通过环境变量覆盖 settings 默认值（settings.py 读 REPO_ROOT/.env，容器内无此文件）
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:?请设置 SECRET_KEY}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-documind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-documind_123}
      POSTGRES_DB: ${POSTGRES_DB:-documind}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      LLM_API_KEY: ${LLM_API_KEY:?请设置 LLM_API_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_MODEL: ${LLM_MODEL}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      # 显式覆盖 upload_dir 到持久化卷（settings 默认 /var/uploads）
      UPLOAD_DIR: /app/var/uploads
    volumes:
      # 上传文件持久化
      - uploads_prod:/app/var/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    # 迁移在容器内启动时执行，不用额外命令；但为健康检查暴露原端口
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
    ports:
      - "${PROD_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data_prod:
  redis_data_prod:
  uploads_prod: